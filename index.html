<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>necrotrachea — metal/gore name generator</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --border: #2a2a2a;
    --text: #d4d4d4;
    --dim: #777;
    --accent: #b3161c;
    --accent-bright: #e5252d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(2rem, 8vw, 3.5rem);
    letter-spacing: 0.06em;
    color: var(--accent-bright);
    text-transform: lowercase;
    margin-bottom: .25rem;
    text-shadow: 0 0 18px rgba(229,37,45,.35);
  }
  .tagline { color: var(--dim); font-size: .85rem; margin-bottom: 2rem; }
  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .row { display: flex; align-items: center; gap: .75rem; }
  .row label { flex: 0 0 7.5rem; color: var(--dim); font-size: .85rem; }
  .row output { flex: 0 0 2.5rem; text-align: right; color: var(--accent-bright); font-weight: 600; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=number] {
    flex: 1; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: .4rem .6rem; font-size: 1rem;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: .8rem;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--accent-bright); }
  button:active { transform: translateY(1px); }
  #names {
    width: 100%;
    max-width: 480px;
    margin-top: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .name {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: .7rem .9rem;
    font-family: Georgia, serif;
    font-size: 1.15rem;
    letter-spacing: .03em;
    cursor: pointer;
    transition: border-color .15s;
    word-break: break-all;
  }
  .name:hover { border-color: var(--accent); }
  .name.copied { color: var(--accent-bright); }
  footer { margin-top: 2.5rem; color: var(--dim); font-size: .75rem; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<h1>necrotrachea</h1>
<p class="tagline">random metal / gore name generator</p>

<div class="controls">
  <div class="row">
    <label for="length">length ≈</label>
    <input type="range" id="length" min="6" max="40" value="14">
    <output id="lengthOut">14</output>
  </div>
  <div class="row">
    <label for="count">names</label>
    <input type="number" id="count" min="1" max="50" value="8">
  </div>
  <button id="gen">Rend</button>
</div>

<div id="names"></div>

<footer><a href="https://github.com/tinkthemaker/necrotrachea">source</a></footer>

<script>
const PREFIXES = [
  "Gore","Blood","Corpse","Viscer","Rot","Putr","Necro","Carn","Butcher",
  "Slaughter","Disembowl","Exsanguin","Gut","Flesh","Bone","Marrow","Grave",
  "Crypt","Cadaver","Sepulch","Tor","Vile","Fetid","Maggot","Worm","Bile",
  "Phlegm","Pus","Gangr","Ulcer","Cyst","Boil","Scab","Wound","Gash","Lacer",
  "Punct","Skull","Spine","Rib","Femur","Sinew","Tendon","Gristle","Hemorrh",
  "Thromb","Necrot","Putresc","Mortu","Funer","Sepul",
];
const MIDDLES = [
  "spawn","rend","gorg","churn","slath","writhe","belch","spew","clot",
  "fiend","stalk","crawl","drip","seep","ooze","blight","murk","grime",
  "mawl","gor","husk",
];
const SUFFIXES = [
  "fiend","wraith","reaper","butcher","lord","spawn","shroud","casket",
  "womb","pyre","altar","chalice","monolith","shrine","throne","vortex",
  "abyss","chasm","mausoleum","ossuary","effigy","reliquary","sepulcher",
  "catacomb","gallows","pit","eater","devourer","feaster","gurgler",
  "sprayer","chewer",
];
const JOINERS = ["","","","-"," "];

const pick = a => a[Math.floor(Math.random() * a.length)];

function makeName(targetLen) {
  let name = pick(PREFIXES);
  const joiner = pick(JOINERS);
  while (name.length + joiner.length + 6 < targetLen - 3) {
    name += pick(MIDDLES);
    if (Math.random() < 0.3) name += pick(["x","th","gh","rr","ck"]);
  }
  return name + joiner + pick(SUFFIXES);
}

const $ = id => document.getElementById(id);
const lengthEl = $("length"), lengthOut = $("lengthOut");
lengthEl.addEventListener("input", () => lengthOut.textContent = lengthEl.value);

function render(names) {
  const box = $("names");
  box.innerHTML = "";
  for (const n of names) {
    const div = document.createElement("div");
    div.className = "name";
    div.textContent = n;
    div.title = "tap to copy";
    div.onclick = () => {
      navigator.clipboard.writeText(n).then(() => {
        div.classList.add("copied");
        setTimeout(() => div.classList.remove("copied"), 600);
      });
    };
    box.appendChild(div);
  }
}

function generate() {
  const len = +lengthEl.value;
  const count = Math.max(1, Math.min(50, +$("count").value || 1));
  const names = Array.from({length: count}, () => makeName(len));
  render(names);
}

$("gen").addEventListener("click", generate);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); generate(); }
});
generate();
</script>
</body>
</html>
